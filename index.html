<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VULNER ZX301 | Penetration Testing Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="header-left">
                <h1>VULNER ZX301</h1>
                <p class="subtitle">Automated Network Vulnerability Report</p>
            </div>
            <div class="header-right">
                <input type="text" id="searchInput" placeholder="Search IP, Port, or Vulnerability..." onkeyup="filterResults()">
                <select id="severityFilter" onchange="filterResults()">
                    <option value="all">All Severities</option>
                    <option value="high">High & Critical</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
        </header>

        <main class="content">
            <div class="summary-cards">
                <div class="card stat-card">
                    <h3>Total Hosts Scanned</h3>
                    <div class="stat-value" id="totalHosts">0</div>
                </div>
                <div class="card stat-card">
                    <h3>Open Ports Found</h3>
                    <div class="stat-value" id="totalPorts">0</div>
                </div>
                <div class="card stat-card">
                    <h3>Vulnerabilities Detected</h3>
                    <div class="stat-value text-danger" id="totalVulns">0</div>
                </div>
                <div class="card stat-card">
                    <h3>Weak Credentials</h3>
                    <div class="stat-value text-warning" id="totalCreds">0</div>
                </div>
            </div>

            <div class="results-container">
                <div class="section-title">
                    <h2>Host Details & Vulnerabilities</h2>
                </div>
                <div id="hostsList" class="hosts-grid">
                    <!-- Data injected via JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Data payload will be injected by the Bash script below -->
    <script id="vulnerData" type="application/json">
        []
    </script>
    <script src="script.js"></script>
</body>
</html>
